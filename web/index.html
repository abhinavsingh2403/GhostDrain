<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Drains — Bengaluru 3D Civic Hydrology</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app-root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    #view-map {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    #error-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: #dc2626;
      color: white;
      font-size: 14px;
      z-index: 2000;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.4); }
    }
    /* Sleek custom scrollbars for dark mode */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.45);
    }
    button {
      user-select: none;
      -webkit-user-select: none;
    }
    button:active {
      transform: scale(0.97);
    }
    /* MapLibre glass control aesthetics */
    .maplibregl-ctrl-bottom-right {
      margin-bottom: 10px !important;
      margin-right: 12px !important;
    }
    .maplibregl-ctrl-attrib.maplibregl-compact {
      background-color: rgba(15, 23, 42, 0.75) !important;
      backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(56, 189, 248, 0.25) !important;
      border-radius: 9999px !important;
      color: #94a3b8 !important;
    }
    .maplibregl-ctrl-attrib.maplibregl-compact a {
      color: #38bdf8 !important;
    }
    .maplibregl-ctrl-group {
      background: rgba(15, 23, 42, 0.85) !important;
      backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(56, 189, 248, 0.2) !important;
      border-radius: 8px !important;
      box-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.5) !important;
      overflow: hidden !important;
    }
    .maplibregl-ctrl-group button {
      border-bottom: 1px solid rgba(148, 163, 184, 0.12) !important;
    }
    .maplibregl-ctrl-group button:last-child {
      border-bottom: none !important;
    }
    .maplibregl-ctrl-scale {
      background: rgba(15, 23, 42, 0.75) !important;
      backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(56, 189, 248, 0.3) !important;
      border-top: none !important;
      color: #cbd5e1 !important;
      font-size: 10px !important;
      font-family: monospace !important;
      border-radius: 0 0 4px 4px !important;
      padding: 2px 6px !important;
      margin-left: 12px !important;
      margin-bottom: 10px !important;
    }
  </style>
</head>
<body>
  <div id="error-banner" role="alert"></div>
  <div id="app-root">
    <div id="view-map">
      <div id="map"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
